server.port=${PORT:8080}

spring.datasource.url=${MYSQL_URL}
#spring.datasource.username=${MYSQLUSER}
#spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
docusign.integration-key=${DOCUSIGN_INTEGRATION_KEY}
docusign.user-id=${DOCUSIGN_USER_ID}
docusign.account-id=${DOCUSIGN_ACCOUNT_ID}
docusign.base-path=${DOCUSIGN_BASE_PATH}
docusign.oauth-base-path=${DOCUSIGN_OAUTH_BASE_PATH}

mercadopago.access.token=${MP_ACCESS_TOKEN}


documentos.path=uploads/documentos/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


frontend.url=https://adrentar-frontend.vercel.app/